<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Werewolf with Voice & Text Chat</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  :root{
    --ink:#0a0c10;
    --paper:#12151b;
    --paper2:#181c24;
    --line:#262b35;
    --moon:#d9c98a;
    --moon-dim:#8a7f52;
    --blood:#b8443a;
    --good:#4fa88a;
    --text:#e8e6df;
    --dim:#868b96;
    --voice-active:#38bdf8;
    --speaking-glow:#22c55e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background: radial-gradient(ellipse at 50% -10%, #1b2030 0%, var(--ink) 55%);
    color:var(--text);
    font-family: Georgia, 'Iowan Old Style', serif;
    min-height:100vh;
    padding:16px 12px 100px;
  }
  body[dir="rtl"]{ font-family:'Tahoma','Segoe UI',Georgia,serif; }
  .wrap{max-width:680px; margin:0 auto;}
  
  .langbar{display:flex; justify-content:center; gap:8px; margin-bottom:12px;}
  .langbtn{
    font-family:'Courier New', monospace; font-size:11px; letter-spacing:0.1em;
    padding:6px 14px; border:1px solid var(--line); color:var(--dim);
    background:transparent; border-radius:20px; cursor:pointer; transition:all 0.2s;
  }
  .langbtn.active{border-color:var(--moon-dim); color:var(--moon); background:rgba(217,201,138,0.08);}
  #banner{display:none; background:#3a2323; border:1px solid var(--blood); color:#f0d9d6; font-size:12.5px; padding:10px 14px; border-radius:4px; margin-bottom:14px; font-family:'Courier New',monospace; text-align:center;}
  .eyebrow{font-family:'Courier New', monospace; letter-spacing:0.28em; text-transform:uppercase; font-size:11px; color:var(--moon-dim); text-align:center; margin-bottom:6px;}
  body[dir="rtl"] .eyebrow{letter-spacing:0.08em;}
  h1{text-align:center; font-size:28px; margin:0 0 4px; font-weight:400;}
  h1 span{color:var(--moon);}
  .sub{text-align:center; color:var(--dim); font-size:13px; margin-bottom:18px; font-family:'Courier New', monospace;}
  body[dir="rtl"] .sub{font-family:inherit;}

  .card{background:var(--paper); border:1px solid var(--line); border-radius:6px; padding:18px; position:relative; margin-bottom:16px; box-shadow:0 4px 20px rgba(0,0,0,0.4);}
  .card::before{content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg, transparent, var(--moon-dim), transparent);}
  label{display:block; font-family:'Courier New', monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--dim); margin-bottom:6px; margin-top:14px;}
  body[dir="rtl"] label{font-family:inherit; letter-spacing:0.02em;}
  label:first-child{margin-top:0;}
  input, select{width:100%; background:var(--paper2); border:1px solid var(--line); color:var(--text); padding:11px 12px; font-size:15px; font-family:Georgia,serif; border-radius:4px; outline:none; transition:border-color 0.2s;}
  body[dir="rtl"] input, body[dir="rtl"] select{font-family:inherit; text-align:right;}
  input:focus, select:focus{border-color:var(--moon-dim);}
  input::placeholder{color:#565c68;}
  button{width:100%; padding:13px; background:var(--moon); color:#141414; border:none; font-family:'Courier New', monospace; font-weight:bold; letter-spacing:0.08em; text-transform:uppercase; font-size:13px; border-radius:4px; margin-top:14px; cursor:pointer; transition:transform 0.1s, opacity 0.2s;}
  body[dir="rtl"] button{font-family:inherit; letter-spacing:0.02em;}
  button:active{transform:scale(0.98); opacity:0.85;}
  button.ghost{background:transparent; border:1px solid var(--line); color:var(--text);}
  button.danger{background:var(--blood); color:#fff;}
  button.small{margin-top:8px; padding:9px; font-size:11px;}
  button:disabled{opacity:0.35; cursor:not-allowed; transform:none;}

  .choice-grid{display:flex; gap:10px; margin-top:6px;}
  .choice{flex:1; border:1px solid var(--line); background:var(--paper2); padding:16px 8px; text-align:center; border-radius:4px; cursor:pointer; font-family:'Courier New', monospace; text-transform:uppercase; font-size:11px; color:var(--dim); transition:border-color 0.2s;}
  .choice:hover{border-color:var(--moon-dim);}
  body[dir="rtl"] .choice{font-family:inherit; letter-spacing:0;}
  .choice b{display:block; font-family:Georgia,serif; font-size:18px; color:var(--text); text-transform:none; margin-bottom:4px;}
  body[dir="rtl"] .choice b{font-family:inherit;}
  .code-display{text-align:center; font-family:'Courier New', monospace; letter-spacing:0.35em; font-size:32px; color:var(--moon); margin:6px 0 4px; direction:ltr;}
  .plist{list-style:none; padding:0; margin:12px 0 0;}
  .plist li{display:flex; align-items:center; justify-content:space-between; padding:10px 6px; border-bottom:1px solid var(--line); font-size:14.5px;}
  .plist li:last-child{border-bottom:none;}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--moon); display:inline-block; margin-inline-end:10px;}
  .empty{color:var(--dim); font-size:13px; font-family:'Courier New', monospace; text-align:center; padding:16px 0;}
  .err{color:var(--blood); font-size:12px; font-family:'Courier New', monospace; margin-top:10px; text-align:center; min-height:14px;}
  .back{text-align:center; margin-top:14px; font-family:'Courier New', monospace; font-size:11px; letter-spacing:0.1em; color:var(--dim); cursor:pointer; text-decoration:underline;}
  body[dir="rtl"] .back{font-family:inherit;}
  .pulse{animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}

  .flipzone{display:flex; justify-content:center; padding:10px 0 6px;}
  .flipcard{width:190px; height:260px; perspective:1200px; cursor:pointer;}
  .flipinner{position:relative; width:100%; height:100%; transition:transform .7s cubic-bezier(.4,.2,.2,1); transform-style:preserve-3d;}
  .flipcard.flipped .flipinner{transform:rotateY(180deg);}
  .face{position:absolute; inset:0; backface-visibility:hidden; border-radius:10px; border:1px solid var(--moon-dim); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; text-align:center;}
  .face.front{background: repeating-linear-gradient(135deg, #1b2030, #1b2030 8px, #171b25 8px, #171b25 16px); box-shadow:inset 0 0 40px rgba(0,0,0,0.6);}
  .face.front .moonicon{font-size:48px; filter:drop-shadow(0 0 14px rgba(217,201,138,0.5));}
  .face.front .tapline{margin-top:12px; font-family:'Courier New', monospace; font-size:11px; letter-spacing:0.15em; color:var(--moon-dim); text-transform:uppercase;}
  body[dir="rtl"] .face.front .tapline{font-family:inherit; letter-spacing:0.02em;}
  .face.back{background:var(--paper2); transform:rotateY(180deg);}
  .face.back .roleicon{font-size:52px; margin-bottom:6px;}
  .face.back .rolename{font-size:22px; color:var(--moon); margin-bottom:6px;}
  .face.back .roledesc{font-size:12px; color:var(--dim); line-height:1.45;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(92px,1fr)); gap:10px; margin-top:10px;}
  .pcard{position:relative; background:var(--paper2); border:1.5px solid var(--line); border-radius:6px; padding:10px 4px 8px; text-align:center; cursor:pointer; transition:border-color 0.15s, box-shadow 0.2s;}
  .pcard .av{font-size:26px; margin-bottom:4px; position:relative; display:inline-block;}
  .pcard .nm{font-size:12px; color:var(--text); word-break:break-word; padding:0 2px;}
  .pcard.selected{border-color:var(--moon); box-shadow:0 0 0 2px var(--moon);}
  .pcard.dead{opacity:0.45;}
  .pcard.disabled{cursor:default;}
  .pcard.speaking{border-color:var(--speaking-glow); box-shadow:0 0 12px rgba(34,197,94,0.6);}
  .pcard .speaking-wave{position:absolute; top:-4px; right:-4px; background:var(--speaking-glow); color:#000; font-size:10px; width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center; animation:popSpeak 0.6s infinite alternate;}
  @keyframes popSpeak { from{transform:scale(0.8);} to{transform:scale(1.2);} }
  .pcard .skull{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:26px; background:rgba(10,10,12,0.6); border-radius:6px;}
  .pcard .rolebadge{position:absolute; top:-6px; inset-inline-end:-6px; font-size:14px; background:var(--paper); border:1px solid var(--line); border-radius:50%; width:22px; height:22px; display:flex; align-items:center; justify-content:center;}

  .tab-bar{display:flex; border-bottom:1px solid var(--line); margin-bottom:12px;}
  .tab-item{flex:1; text-align:center; padding:8px 4px; font-family:'Courier New', monospace; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--dim); cursor:pointer; border-bottom:2px solid transparent; transition:all 0.2s;}
  body[dir="rtl"] .tab-item{font-family:inherit;}
  .tab-item.active{color:var(--moon); border-bottom-color:var(--moon);}
  .tab-item .badge{background:var(--blood); color:#fff; font-size:9px; padding:1px 5px; border-radius:10px; margin-inline-start:4px;}

  .log{max-height:180px; overflow-y:auto; background:var(--paper2); border:1px solid var(--line); border-radius:4px; padding:10px 12px; font-size:13px; line-height:1.6;}
  .log .entry{border-bottom:1px dashed #262b35; padding:5px 0;}
  .log .entry:last-child{border-bottom:none;}
  .log .entry.death{color:var(--blood);}
  .log .entry.safe{color:var(--good);}
  .log .entry.win{color:var(--moon); font-weight:bold;}

  .chat-panel{display:flex; flex-direction:column; height:200px; background:var(--paper2); border:1px solid var(--line); border-radius:4px; overflow:hidden;}
  .chat-messages{flex:1; overflow-y:auto; padding:10px; font-size:13px; display:flex; flex-direction:column; gap:6px;}
  .chat-msg{background:rgba(255,255,255,0.03); border:1px solid var(--line); padding:6px 10px; border-radius:6px; max-width:88%; word-break:break-word;}
  .chat-msg.mine{align-self:flex-end; background:rgba(217,201,138,0.1); border-color:var(--moon-dim);}
  .chat-msg.wolf{border-color:var(--blood); background:rgba(184,68,58,0.15);}
  .chat-sender{font-size:10px; font-family:'Courier New', monospace; color:var(--dim); margin-bottom:2px;}
  .chat-text{color:var(--text); line-height:1.35;}
  .chat-input-box{display:flex; gap:6px; padding:8px; border-top:1px solid var(--line); background:var(--paper);}
  .chat-input-box input{flex:1; padding:8px 10px; font-size:13px;}
  .chat-input-box button{width:auto; margin-top:0; padding:8px 14px; font-size:11px;}

  /* Floating persistent Voice Chat bar */
  .voice-bar{
    position:fixed; bottom:0; left:0; right:0; z-index:100;
    background:#101319; border-top:1px solid var(--line);
    padding:10px 14px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 -4px 20px rgba(0,0,0,0.6); backdrop-filter:blur(10px);
  }
  .voice-status{display:flex; align-items:center; gap:8px; font-size:12px; font-family:'Courier New', monospace; color:var(--dim);}
  body[dir="rtl"] .voice-status{font-family:inherit;}
  .v-indicator{width:10px; height:10px; border-radius:50%; background:var(--dim);}
  .v-indicator.active{background:var(--speaking-glow); box-shadow:0 0 8px var(--speaking-glow);}
  .v-indicator.muted{background:var(--blood);}
  .voice-btns{display:flex; gap:6px;}
  .v-btn{
    background:var(--paper2); border:1px solid var(--line); color:var(--text);
    padding:6px 12px; border-radius:20px; font-size:12px; font-family:'Courier New', monospace;
    cursor:pointer; display:flex; align-items:center; gap:4px; margin-top:0; width:auto;
  }
  body[dir="rtl"] .v-btn{font-family:inherit;}
  .v-btn.primary{background:var(--moon); color:#141414; border-color:var(--moon); font-weight:bold;}
  .v-btn.active{border-color:var(--speaking-glow); color:var(--speaking-glow);}
  .v-btn.danger{background:var(--blood); border-color:var(--blood); color:#fff;}

  .roletag{display:inline-flex; align-items:center; gap:6px; font-family:'Courier New', monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--moon); border:1px solid var(--moon-dim); padding:4px 10px; border-radius:20px; margin-bottom:6px;}
  body[dir="rtl"] .roletag{font-family:inherit; letter-spacing:0.02em;}
  .center{text-align:center;}
  .progress{font-family:'Courier New', monospace; font-size:12px; color:var(--dim); text-align:center; margin-top:10px;}
  body[dir="rtl"] .progress{font-family:inherit;}
</style>
</head>

    <button class="langbtn" id="btnEN" style="width:auto;margin:0;">English</button>

  </div>
  <div id="banner"></div>
  <div id="content"></div>
</div>

<!-- Floating voice chat panel -->
<div class="voice-bar" id="voiceBar">
  <div class="voice-status">
    <div class="v-indicator" id="vIndicator"></div>
    <span id="vStatusText">Voice Chat Off</span>
  </div>
  <div class="voice-btns" id="vBtns">
    <button class="v-btn primary" id="btnJoinVoice">🎙️ Join Voice</button>
  </div>
</div>

<script>
const content = document.getElementById('content');
const bannerEl = document.getElementById('banner');
let lang = 'en';
let me = { id:'p_'+Math.random().toString(36).slice(2,10), name:'', isHost:false, peerId:'' };
let roomCode = '';
let room = null;
let screen = 'landing';
let draft = { hostName:'', joinCode:'', joinName:'' };
let flipState = { flipped:false, ready:false };
let selection = null;
let activeTab = 'log'; // 'log' or 'chat'
let unreadChatCount = 0;

// PeerJS Networking setup
let peer = null;
let hostConn = null; // Used by clients to communicate with Host
let clientConns = []; // Used by Host to store client data connections
let peerCalls = {}; // Stores WebRTC Media Calls with peers { peerId: call }

// Voice Chat WebRTC State
let localAudioStream = null;
let isMicMuted = false;
let isDeafened = false;
let isVoiceConnected = false;
let audioContext = null;
let speakingMap = {}; // { playerId: boolean }
let remoteAudioElements = {}; // { peerId: HTMLAudioElement }

const PEER_PREFIX = 'ww_room_v3_';

function broadcastState() {
  if (me.isHost) {
    clientConns.forEach(c => {
      if (c && c.open) c.send({ type: 'STATE', room });
    });
    render();
  }
}

function sendToHost(msg) {
  if (hostConn && hostConn.open) {
    hostConn.send(msg);
  }
}

function broadcastChatMsg(msg) {
  if (!room.chat) room.chat = [];
  room.chat.push(msg);
  if (me.isHost) {
    clientConns.forEach(c => {
      if (c && c.open) c.send({ type: 'CHAT', message: msg });
    });
    render();
  }
}

function randCode(){

  for(let i=0;i<4;i++) s+=c[Math.floor(Math.random()*c.length)];

function resetPeer() {
  stopVoiceChat();
  if (peer) { peer.destroy(); peer = null; }
  clientConns = [];
  hostConn = null;
}

async function startVoiceChat() {
  try {
    localAudioStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    isVoiceConnected = true;
    setupAudioAnalysis(localAudioStream, me.id);
    
    // Listen for incoming calls from peers
    if (peer) {
      peer.on('call', (call) => {
        call.answer(localAudioStream);
        call.on('stream', (remoteStream) => {
          handleRemoteStream(call.peer, remoteStream);
        });
        peerCalls[call.peer] = call;
      });
    }

    // Call all existing peers in room
    connectVoiceToRoomPeers();
    updateVoiceBarUI();
    render();
  } catch (err) {
    console.error("Microphone access denied or error:", err);
    alert(lang === 'ar' ? "لم نتمكن من الوصول للمايكروفون. يرجى السماح بالصلاحيات." : "Could not access microphone. Please allow mic permissions.");
  }
}

function connectVoiceToRoomPeers() {
  if (!room || !room.players || !localAudioStream || !peer) return;
  room.players.forEach(p => {
    if (p.peerId && p.peerId !== me.peerId && !peerCalls[p.peerId]) {
      const call = peer.call(p.peerId, localAudioStream);
      if (call) {
        call.on('stream', (remoteStream) => {
          handleRemoteStream(p.peerId, remoteStream);
        });
        peerCalls[p.peerId] = call;
      }
    }
  });
}

function handleRemoteStream(peerId, remoteStream) {
  if (!remoteAudioElements[peerId]) {
    const audio = document.createElement('audio');
    audio.autoplay = true;
    audio.srcObject = remoteStream;
    audio.muted = isDeafened;
    document.body.appendChild(audio);
    remoteAudioElements[peerId] = audio;

    // Find player ID associated with this peer ID
    const targetPlayer = room ? room.players.find(p => p.peerId === peerId) : null;
    const targetId = targetPlayer ? targetPlayer.id : peerId;
    setupAudioAnalysis(remoteStream, targetId);
  }
}

function toggleMic() {
  if (!localAudioStream) return;
  isMicMuted = !isMicMuted;
  localAudioStream.getAudioTracks().forEach(track => { track.enabled = !isMicMuted; });
  if (isMicMuted) speakingMap[me.id] = false;
  updateVoiceBarUI();
  render();
}

function toggleDeafen() {
  isDeafened = !isDeafened;
  Object.values(remoteAudioElements).forEach(audio => { audio.muted = isDeafened; });
  updateVoiceBarUI();
}

function stopVoiceChat() {
  if (localAudioStream) {
    localAudioStream.getTracks().forEach(track => track.stop());
    localAudioStream = null;
  }
  Object.values(peerCalls).forEach(call => call.close());
  peerCalls = {};
  Object.values(remoteAudioElements).forEach(audio => audio.remove());
  remoteAudioElements = {};
  isVoiceConnected = false;
  speakingMap = {};
  updateVoiceBarUI();
}

function setupAudioAnalysis(stream, playerId) {
  try {
    if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioContext.createMediaStreamSource(stream);
    const analyser = audioContext.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);

    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);

    const checkVolume = () => {
      if (!isVoiceConnected) return;
      analyser.getByteFrequencyData(dataArray);
      let sum = 0;
      for (let i = 0; i < bufferLength; i++) sum += dataArray[i];
      let average = sum / bufferLength;

      const isSpeakingNow = average > 18 && !(playerId === me.id && isMicMuted);
      if (speakingMap[playerId] !== isSpeakingNow) {
        speakingMap[playerId] = isSpeakingNow;
        updateSpeakingUI(playerId, isSpeakingNow);
      }
      requestAnimationFrame(checkVolume);
    };
    checkVolume();
  } catch (e) {
    console.error("Audio analysis setup failed", e);
  }
}

function updateSpeakingUI(playerId, isSpeaking) {
  const card = document.querySelector(`.pcard[data-id="${playerId}"]`);
  if (card) {
    card.classList.toggle('speaking', isSpeaking);
    let wave = card.querySelector('.speaking-wave');
    if (isSpeaking && !wave) {
      wave = document.createElement('div');
      wave.className = 'speaking-wave';
      wave.innerHTML = '🔊';
      card.appendChild(wave);
    } else if (!isSpeaking && wave) {
      wave.remove();
    }
  }
}

function assignRoles(playerIds){
  const n = playerIds.length;
  const wolves = n>=10?3:(n>=6?2:1);
  const hasHunter = n>=8;
  const pool = [];
  for(let i=0;i<wolves;i++) pool.push('werewolf');
  pool.push('seer','doctor');
  if(hasHunter) pool.push('hunter');
  while(pool.length < n) pool.push('villager');
  pool.length = n;
  for(let i=pool.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]] = [pool[j],pool[i]];
  }
  const roles = {};
  playerIds.forEach((id,i)=> roles[id]=pool[i]);
  return roles;
}

function aliveIds(r){ return r.players.map(p=>p.id).filter(id=>r.alive[id]); }
function aliveWolves(r){ return aliveIds(r).filter(id=>r.roles[id]==='werewolf'); }
function playerName(r,id){ const p=r.players.find(p=>p.id===id); return p?p.name:'?'; }

function render(){
  if(!roomCode){
    if(screen==='hostSetup') return renderHostSetup();
    if(screen==='joinSetup') return renderJoinSetup();
    return renderLanding();
  }
  if(!room) return renderLoading();
  switch(room.phase){
    case 'lobby': return renderLobby();
    case 'reveal': return renderReveal();
    case 'night': return renderNight();
    case 'night_hunter_revenge': return renderHunterRevenge();
    case 'day_reveal': return renderDayReveal();
    case 'voting': return renderVoting();

    default: return renderLoading();
  }
}

        votes:{}, log:[{type:'created'}], chat:[],
        hunterPending:null, winner:null
      };
      render();
    });

    peer.on('connection', (conn)=>{
      clientConns.push(conn);
      conn.on('data', (data)=>{
        if(!me.isHost) return;
        if(data.type === 'JOIN') {
          if(room.phase !== 'lobby') {
            conn.send({type:'ERR', msg: t().alreadyStarted});
            return;
          }
          if(room.players.some(p => p.name.toLowerCase() === data.name.toLowerCase())) {
            conn.send({type:'ERR', msg: t().nameTaken});
            return;
          }
          room.players.push({id: data.id, name: data.name, peerId: data.peerId});
          conn.send({type:'JOIN_ACK', room});
          broadcastState();
          connectVoiceToRoomPeers();
        } else if(data.type === 'ACTION') {
          handleClientAction(data);
        } else if(data.type === 'CHAT') {
          broadcastChatMsg(data.message);
        }
      });
    });

    peer.on('error', (err)=>{
      showErr('err', s.connErr);
      const btn=document.getElementById('createBtn'); if(btn) btn.disabled=false;
    });
  };
}

function handleClientAction(data) {
  if (data.action === 'NIGHT_SUBMIT') {
    const { myRole, playerId, targetId } = data;
    if(myRole==='werewolf') room.night.wolfVotes[playerId]=targetId;
    if(myRole==='seer') room.night.seerTarget[playerId]=targetId;
    if(myRole==='doctor') room.night.doctorTarget[playerId]=targetId;
    broadcastState();
  } else if (data.action === 'HUNTER_SHOT') {
    const shooter = room.hunterPending;
    const targetId = data.targetId;
    room.alive[targetId] = false;
    room.log.push({type:'hunter_shot', a: shooter, b: targetId});
    room.hunterPending = null;
    const cameFromDay = room._returnPhase === 'day';
    room._returnPhase = null;
    const win = checkWin(room);
    if(win){
      room.winner=win; room.phase='ended'; room.log.push({type: win==='villagers'?'win_villagers':'win_wolves'});
    } else if(cameFromDay){
      room.round += 1;
      room.phase = 'night';
      room.night = {wolfVotes:{}, doctorTarget:{}, seerTarget:{}};
      room.log.push({type:'night_begin', round:room.round});
    } else {
      room.phase = 'day_reveal';
    }
    broadcastState();
  } else if (data.action === 'VOTE_SUBMIT') {
    room.votes[data.playerId] = data.targetId;
    broadcastState();
  }
}

let transitioning = false;

function ensureRevealTicker(){
  if(revealTicker) return;
  revealTicker = setInterval(()=>{
    if(room && room.phase==='reveal'){
      render();
    } else {
      clearInterval(revealTicker); revealTicker=null;
    }
  }, 1000);
}
function beginNightFromReveal(){
  if(transitioning || !me.isHost) return;
  transitioning = true;
  room.phase = 'night';
  room.log.push({type:'night_begin', round:room.round});
  transitioning = false;
  selection = null;
  broadcastState();
}

            </div>
            <div class="face back">
              <div class="roleicon">${ROLE_ICON[myRole]}</div>
              <div class="rolename">${rd.name}</div>
              <div class="roledesc">${rd.desc}</div>
            </div>
          </div>
        </div>
      </div>
      <div class="progress">${s.autoStartIn(remaining)}</div>
      ${isHost ? `<button class="ghost small" id="beginBtn">${s.beginNight}</button>` : ''}
    </div>
  `;
  document.getElementById('flipcard').onclick = ()=>{
    if(flipState.flipped) return;
    flipState.flipped = true;
    render();
  };
  if(isHost){
    const bb = document.getElementById('beginBtn');
    if(bb) bb.onclick = ()=> beginNightFromReveal();
  }
}

function renderRoleBadge(){
  const s=t();
  const myRole = room.roles[me.id];
  if(!myRole) return '';
  const alive = room.alive[me.id];
  return `<div class="center" style="margin-bottom:12px;"><span class="roletag">${ROLE_ICON[myRole]} ${s.yourRoleLabel}: ${s.roles[myRole].name}${alive?'':' 💀'}</span></div>`;
}

function renderCardsGrid(playerList, opts){
  const s=t();
  const html = playerList.map(p=>{
    const isDead = !room.alive[p.id];
    const isSelected = opts.selectedId === p.id;
    const disabled = (opts.disabledIds||[]).includes(p.id) || (isDead && !opts.deadSelectable);
    const isSpeaking = !!speakingMap[p.id];
    return `<div class="pcard ${isDead?'dead':''} ${isSelected?'selected':''} ${disabled?'disabled':''} ${isSpeaking?'speaking':''}" data-id="${p.id}">
      <div class="av">${avatarFor(p.id)}</div>
      <div class="nm">${p.name}${p.id===me.id?' '+s.you:''}</div>
      ${isSpeaking ? `<div class="speaking-wave">🔊</div>` : ''}
      ${isDead && opts.showSkull!==false ? `<div class="skull">💀</div>` : ''}
      ${opts.roleBadges && opts.roleBadges[p.id] ? `<div class="rolebadge">${opts.roleBadges[p.id]}</div>` : ''}
    </div>`;
  }).join('');
  return `<div class="grid">${html}</div>`;
}

function renderNight(){
  const s=t();
  const myRole = room.roles[me.id];
  const amAlive = room.alive[me.id];
  const isHost = me.isHost;
  const targets = room.players.filter(p=>room.alive[p.id]);

  let actionBlock = '';
  let submitted = false;

  if(!amAlive){
    actionBlock = `<div class="sub center">${s.waitingNight}</div>`;
  } else if(myRole==='werewolf'){
    submitted = !!room.night.wolfVotes[me.id];
    const disabledIds = room.players.filter(p=>room.roles[p.id]==='werewolf').map(p=>p.id);
    actionBlock = `
      <div class="sub center">${s.yourTurnWolf}</div>
      ${renderCardsGrid(targets, {selectedId: selection || room.night.wolfVotes[me.id], disabledIds})}
      <button id="submitBtn" ${submitted?'disabled':''}>${submitted? s.choiceLocked : s.submitChoice}</button>
    `;
  } else if(myRole==='seer'){
    submitted = !!room.night.seerTarget[me.id];
    const prevTarget = room.night.seerTarget[me.id];
    actionBlock = `
      <div class="sub center">${s.yourTurnSeer}</div>
      ${renderCardsGrid(targets, {selectedId: selection || prevTarget, disabledIds:[me.id]})}
      <button id="submitBtn" ${submitted?'disabled':''}>${submitted? s.choiceLocked : s.submitChoice}</button>
      ${submitted ? `<div class="card" style="margin-top:14px;"><div class="roletag">👁️ ${playerName(room, prevTarget)}</div><div class="sub" style="margin:0;">${room.roles[prevTarget]==='werewolf' ? s.auraResultBad : s.auraResultGood}</div></div>` : ''}
    `;
  } else if(myRole==='doctor'){
    submitted = !!room.night.doctorTarget[me.id];
    actionBlock = `
      <div class="sub center">${s.yourTurnDoctor}</div>
      ${renderCardsGrid(targets, {selectedId: selection || room.night.doctorTarget[me.id]})}
      <button id="submitBtn" ${submitted?'disabled':''}>${submitted? s.choiceLocked : s.submitChoice}</button>
    `;
  } else {
    actionBlock = `<div class="sub center">${s.villagerNightNote}</div>`;
  }

  const actorsNeeded = room.players.filter(p=>['werewolf','seer','doctor'].includes(room.roles[p.id]) && room.alive[p.id]).length;
  const actorsDone = Object.keys(room.night.wolfVotes).length + Object.keys(room.night.seerTarget).length + Object.keys(room.night.doctorTarget).length;

  content.innerHTML = `
    <div class="eyebrow">${s.nightEyebrow(room.round)}</div>
    <h1>${s.nightTitle} <span>${s.nightAccent}</span></h1>
    ${renderRoleBadge()}
    <div class="card">
      ${actionBlock}
      <div class="progress">${s.nightProgress(actorsDone, actorsNeeded)}</div>
      ${isHost ? `<button class="ghost small" id="resolveBtn">${s.resolveNight}</button>` : ''}
    </div>
    ${renderLogAndChatPanel()}
  `;

  bindLogChatEvents();

  document.querySelectorAll('.pcard').forEach(el=>{
    if(el.classList.contains('disabled')) return;
    el.onclick = ()=>{
      selection = el.dataset.id;
      render();
    };
  });
  const sb = document.getElementById('submitBtn');
  if(sb) sb.onclick = ()=>{
    if(!selection && !room.night.wolfVotes[me.id] && !room.night.seerTarget[me.id] && !room.night.doctorTarget[me.id]) return;
    const targetId = selection;
    if(!targetId) return;

    if (isHost) {
      if(myRole==='werewolf') room.night.wolfVotes[me.id]=targetId;
      if(myRole==='seer') room.night.seerTarget[me.id]=targetId;
      if(myRole==='doctor') room.night.doctorTarget[me.id]=targetId;
      selection = null;
      broadcastState();
    } else {
      sendToHost({ action: 'NIGHT_SUBMIT', myRole, playerId: me.id, targetId });
      selection = null;
    }
  };
  const rb = document.getElementById('resolveBtn');
  if(rb) rb.onclick = ()=> resolveNight();
}

function resolveNight(){
  if (!me.isHost) return;
  const tally = {};
  Object.values(room.night.wolfVotes).forEach(id=>{ tally[id]=(tally[id]||0)+1; });
  let victim=null, max=0;
  Object.entries(tally).forEach(([id,c])=>{ if(c>max){max=c; victim=id;} });
  const protectedIds = new Set(Object.values(room.night.doctorTarget));
  let died = null;
  if(victim && !protectedIds.has(victim)){
    room.alive[victim] = false;
    died = victim;
  }
  if(died){
    room.log.push({type:'deaths', ids:[died]});
  } else {
    room.log.push({type:'peaceful'});
  }
  if(died && room.roles[died]==='hunter'){
    room.hunterPending = died;
    room._returnPhase = 'night';
    room.phase = 'night_hunter_revenge';
  } else {
    room.phase = 'day_reveal';
  }
  const win = checkWin(room);
  if(win){ room.winner = win; room.phase='ended'; room.log.push({type: win==='villagers'?'win_villagers':'win_wolves'}); }
  selection = null;
  broadcastState();
}

function checkWin(r){
  const wolves = aliveIds(r).filter(id=>r.roles[id]==='werewolf').length;
  const others = aliveIds(r).length - wolves;
  if(wolves===0) return 'villagers';
  if(wolves>=others) return 'wolves';
  return null;
}

function renderHunterRevenge(){
  const s=t();
  const isMe = room.hunterPending === me.id;
  const isHost = me.isHost;
  const targets = room.players.filter(p=>room.alive[p.id] && p.id!==room.hunterPending);
  content.innerHTML = `
    <div class="eyebrow">${s.nightEyebrow(room.round)}</div>
    <h1>${s.hunterRevengeTitle} <span>${s.hunterRevengeAccent}</span></h1>
    <div class="sub">${isMe ? s.subHunterRevenge : s.subHunterRevengeWatch}</div>
    ${renderRoleBadge()}
    <div class="card">
      ${isMe ? `
        ${renderCardsGrid(targets, {selectedId: selection})}
        <button id="shotBtn" ${!selection?'disabled':''}>${s.confirmShot}</button>
      ` : `<div class="sub center pulse">🏹</div>`}
    </div>
    ${renderLogAndChatPanel()}
  `;
  bindLogChatEvents();
  if(isMe){
    document.querySelectorAll('.pcard').forEach(el=>{
      if(el.classList.contains('disabled')) return;
      el.onclick=()=>{ selection=el.dataset.id; render(); };
    });
    const btn = document.getElementById('shotBtn');
    if(btn) btn.onclick = ()=>{
      if(!selection) return;
      if (isHost) {
        const shooter = room.hunterPending;
        const targetId = selection;
        room.alive[targetId] = false;
        room.log.push({type:'hunter_shot', a: shooter, b: targetId});
        room.hunterPending = null;
        const cameFromDay = room._returnPhase === 'day';
        room._returnPhase = null;
        const win = checkWin(room);
        if(win){
          room.winner=win; room.phase='ended'; room.log.push({type: win==='villagers'?'win_villagers':'win_wolves'});
        } else if(cameFromDay){
          room.round += 1;
          room.phase = 'night';
          room.night = {wolfVotes:{}, doctorTarget:{}, seerTarget:{}};
          room.log.push({type:'night_begin', round:room.round});
        } else {
          room.phase = 'day_reveal';
        }
        selection = null;
        broadcastState();
      } else {
        sendToHost({ action: 'HUNTER_SHOT', targetId: selection });
        selection = null;
      }
    };
  }
}

function renderLogAndChatPanel(){
  const s=t();
  const unreadBadge = unreadChatCount > 0 ? `<span class="badge">${unreadChatCount}</span>` : '';
  
  let chatContent = '';
  if (activeTab === 'log') {
    const items = (room.log||[]).map(ev=>{
      let cls=''; let txt='';
      switch(ev.type){
        case 'game_start': txt=s.log_game_start; break;
        case 'night_begin': txt=s.log_night_begin(ev.round); break;
        case 'peaceful': txt=s.log_peaceful; cls='safe'; break;
        case 'deaths': txt=s.log_deaths(ev.ids.map(id=>playerName(room,id)).join(', ')); cls='death'; break;
        case 'hunter_shot': txt=s.log_hunter_shot(playerName(room,ev.a), playerName(room,ev.b)); cls='death'; break;
        case 'vote_tie': txt=s.log_vote_tie; break;
        case 'vote_result': txt=s.log_vote_result(playerName(room,ev.id), roleName(room,ev.id)); cls='death'; break;
        case 'win_villagers': txt=s.log_win_villagers; cls='win'; break;
        case 'win_wolves': txt=s.log_win_wolves; cls='win'; break;
        default: txt='';
      }
      return txt ? `<div class="entry ${cls}">${txt}</div>` : '';
    }).join('');
    chatContent = `<div class="log" id="logContainer">${items}</div>`;
  } else {
    // Chat Tab
    const myRole = room.roles[me.id];
    const isWolf = myRole === 'werewolf';
    const isNight = room.phase === 'night';
    
    const visibleMessages = (room.chat || []).filter(m => {
      if (m.isWolfOnly) return isWolf;
      return true;
    });

    const msgsHtml = visibleMessages.map(m => {
      const isMine = m.senderId === me.id;
      return `
        <div class="chat-msg ${isMine ? 'mine' : ''} ${m.isWolfOnly ? 'wolf' : ''}">
          <div class="chat-sender">${m.senderName} ${m.isWolfOnly ? '(🐺 Wolf Chat)' : ''}</div>
          <div class="chat-text">${escapeHtml(m.text)}</div>
        </div>
      `;
    }).join('');

    chatContent = `
      <div class="chat-panel">
        <div class="chat-messages" id="chatMsgs">${msgsHtml}</div>
        <div class="chat-input-box">
          <input id="chatInput" placeholder="${s.typeMsgPH}" maxlength="150">
          <button id="sendChatBtn">${s.sendMsg}</button>
        </div>
      </div>
    `;
  }

  return `
    <div class="card" style="margin-top:10px;">
      <div class="tab-bar">
        <div class="tab-item ${activeTab==='log'?'active':''}" id="tabLog">${s.logTab}</div>
        <div class="tab-item ${activeTab==='chat'?'active':''}" id="tabChat">${s.chatTab} ${unreadBadge}</div>
      </div>
      ${chatContent}
    </div>
  `;
}

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function bindLogChatEvents() {
  const tabLog = document.getElementById('tabLog');
  const tabChat = document.getElementById('tabChat');
  if (tabLog) tabLog.onclick = () => { activeTab = 'log'; render(); };
  if (tabChat) tabChat.onclick = () => { activeTab = 'chat'; unreadChatCount = 0; render(); };

  const sendBtn = document.getElementById('sendChatBtn');
  const chatInput = document.getElementById('chatInput');
  if (sendBtn && chatInput) {
    const doSend = () => {
      const txt = chatInput.value.trim();
      if (!txt) return;
      const myRole = room.roles[me.id];
      const isWolfOnly = room.phase === 'night' && myRole === 'werewolf';

      const msg = {
        id: 'm_' + Math.random().toString(36).slice(2, 8),
        senderId: me.id,
        senderName: me.name,
        text: txt,
        isWolfOnly
      };

      if (me.isHost) {
        broadcastChatMsg(msg);
      } else {
        sendToHost({ type: 'CHAT', message: msg });
      }
      chatInput.value = '';
    };

    sendBtn.onclick = doSend;
    chatInput.onkeydown = (e) => { if (e.key === 'Enter') doSend(); };
    
    // Auto-scroll to bottom of chat
    const msgsEl = document.getElementById('chatMsgs');
    if (msgsEl) msgsEl.scrollTop = msgsEl.scrollHeight;
  }

  const logEl = document.getElementById('logContainer');
  if (logEl) logEl.scrollTop = logEl.scrollHeight;
}

function renderDayReveal(){
  const s=t();
  const isHost = me.isHost;
  content.innerHTML = `
    <div class="eyebrow">${s.dayEyebrow(room.round)}</div>
    <h1>${s.dayTitle} <span>${s.dayAccent}</span></h1>
    ${renderRoleBadge()}
    <div class="card">
      ${isHost ? `<button id="voteBtn">${s.continueToVote}</button>` : `<div class="sub center" style="margin-top:14px;">${s.waitingVote}</div>`}
    </div>
    ${renderLogAndChatPanel()}
  `;
  bindLogChatEvents();
  if(isHost){
    document.getElementById('voteBtn').onclick = ()=>{
      room.phase = 'voting';
      room.votes = {};
      broadcastState();
    };
  }
}

function renderVoting(){
  const s=t();
  const isHost = me.isHost;
  const amAlive = room.alive[me.id];
  const targets = room.players.filter(p=>room.alive[p.id]);
  const myVote = room.votes[me.id];
  content.innerHTML = `
    <div class="eyebrow">${s.dayEyebrow(room.round)}</div>
    <h1>${s.votingTitle} <span>${s.votingAccent}</span></h1>
    <div class="sub">${s.subVoting}</div>
    ${renderRoleBadge()}
    <div class="card">
      ${amAlive ? `
        ${renderCardsGrid(targets, {selectedId: selection || myVote, disabledIds: myVote?targets.map(p=>p.id):[me.id]})}
        <button id="voteSubmit" ${myVote?'disabled':''}>${myVote? s.voteLocked : s.voteFor}</button>
      ` : `<div class="sub center">${s.waitingVote}</div>${renderCardsGrid(targets, {selectedId:null, disabledIds: targets.map(p=>p.id)})}`}
      <div class="progress">${s.voteProgress(Object.keys(room.votes).length, aliveIds(room).length)}</div>
      ${isHost ? `<button class="ghost small" id="resolveVoteBtn">${s.resolveVote}</button>` : ''}
    </div>
    ${renderLogAndChatPanel()}
  `;
  bindLogChatEvents();
  if(amAlive && !myVote){
    document.querySelectorAll('.pcard').forEach(el=>{
      if(el.classList.contains('disabled')) return;
      el.onclick=()=>{ selection=el.dataset.id; render(); };
    });
    const vb = document.getElementById('voteSubmit');
    if(vb) vb.onclick = ()=>{
      if(!selection) return;
      if (isHost) {
        room.votes[me.id] = selection;
        selection = null;
        broadcastState();
      } else {
        sendToHost({ action: 'VOTE_SUBMIT', playerId: me.id, targetId: selection });
        selection = null;
      }
    };
  }
  if(isHost){
    document.getElementById('resolveVoteBtn').onclick = ()=> resolveVote();
  }
}

function resolveVote(){
  if (!me.isHost) return;
  const tally = {};
  Object.values(room.votes).forEach(id=>{ tally[id]=(tally[id]||0)+1; });
  let top=null, max=0, tie=false;
  Object.entries(tally).forEach(([id,c])=>{
    if(c>max){max=c; top=id; tie=false;}
    else if(c===max){tie=true;}
  });
  if(top && !tie){
    room.alive[top] = false;
    room.log.push({type:'vote_result', id:top});
    if(room.roles[top]==='hunter'){
      room.hunterPending = top;
      room._returnPhase = 'day';
      room.phase = 'day_hunter_revenge';
      broadcastState();
      return;
    }
  } else {
    room.log.push({type:'vote_tie'});
  }
  const win = checkWin(room);
  if(win){
    room.winner = win;
    room.phase = 'ended';
    room.log.push({type: win==='villagers'?'win_villagers':'win_wolves'});
  } else {
    room.round += 1;
    room.phase = 'night';
    room.night = {wolfVotes:{}, doctorTarget:{}, seerTarget:{}};
    room.log.push({type:'night_begin', round:room.round});
  }
  selection = null;
  broadcastState();
}

function renderEnded(){
  const s=t();
  const isHost = me.isHost;
  const winText = room.winner==='villagers' ? s.winVillagers : s.winWolves;
  const rolesList = room.players.map(p=>{
    const dead = !room.alive[p.id];
    return `<li><span><span class="dot"></span>${p.name}${dead?' 💀':''}</span><span style="color:var(--moon); font-family:'Courier New',monospace; font-size:12px;">${ROLE_ICON[room.roles[p.id]]} ${roleName(room, p.id)}</span></li>`;
  }).join('');

  content.innerHTML = `
    <div class="eyebrow">${s.endEyebrow}</div>
    <h1>${winText}</h1>
    <div class="card" style="margin-top:16px;">
      <label>${s.finalRoles}</label>
      <ul class="plist">${rolesList}</ul>
      ${isHost ? `<button id="againBtn">${s.playAgain}</button>` : ''}
    </div>
    ${renderLogAndChatPanel()}
    <div class="back" id="exitBtn">${s.exitGame}</div>
  `;
  bindLogChatEvents();
  document.getElementById('exitBtn').onclick = ()=>{ screen='landing'; render(); };
  if(isHost){
    document.getElementById('againBtn').onclick = ()=>{
      room.phase = 'lobby';
      room.roles = {};
      room.alive = {};
      room.round = 0;
      broadcastState();
    };
  }
}

// Initial render call
updateVoiceBarUI();
render();
</script>
</body>
</html>
